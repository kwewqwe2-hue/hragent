server {
  listen 80;
  server_name _;
  absolute_redirect off;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 11m;

  location = / { return 302 /agent/; }
  location = /agent { return 302 /agent/; }
  location /agent/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $assistant_ui chat:80;
    proxy_pass http://$assistant_ui;
    proxy_set_header Host $host;
  }

  location = /index.html {
    add_header Cache-Control "no-store" always;
  }

  location /api/ {
    # Resolve the current Docker address instead of retaining it across restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $api_backend backend:8080;
    proxy_pass http://$api_backend;
    proxy_connect_timeout 10s;
    proxy_read_timeout 230s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
