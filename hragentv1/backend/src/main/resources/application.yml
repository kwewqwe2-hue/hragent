server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: hragentv1
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/hragent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:hragent}
    password: ${SPRING_DATASOURCE_PASSWORD:hragent}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: ${DEEPSEEK_MODEL:deepseek-v4-flash}

app:
  encryption-key: ${APP_ENCRYPTION_KEY:local-demo-secret-change-me}
  web-chat:
    identity-secret: ${APP_WEB_CHAT_IDENTITY_SECRET:local-demo-web-chat-identity-secret}
    n8n-webhook-url: ${N8N_WEB_CHAT_WEBHOOK_URL:http://localhost:5678/webhook/hragent-dingtalk-8a2d811d-0fe5-4198-8e61-288ec417fc04}
    n8n-attachment-parse-url: ${N8N_WEB_ATTACHMENT_PARSE_URL:http://localhost:5678/webhook/hragent-web-attachment-parse}
    attachment-internal-key: ${WEB_ATTACHMENT_INTERNAL_KEY:local-demo-web-attachment-internal-key-change-me}
    callback-base-url: ${N8N_WEB_CHAT_CALLBACK_BASE_URL:http://localhost:8080/api}
    timeout-seconds: ${N8N_WEB_CHAT_TIMEOUT_SECONDS:120}
  knowledge:
    n8n-upload-url: ${N8N_KNOWLEDGE_UPLOAD_URL:http://localhost:5678/webhook/hragent-knowledge-ingest}
    n8n-delete-url: ${N8N_KNOWLEDGE_DELETE_URL:http://localhost:5678/webhook/hragent-knowledge-delete}
  certificate:
    storage-root: ${CERTIFICATE_STORAGE_ROOT:./data/certificates}
    company-address: ${CERTIFICATE_COMPANY_ADDRESS:北京市海淀区中关村示例科技园 1 号}
    company-contact: ${CERTIFICATE_COMPANY_CONTACT:010-88886666}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
